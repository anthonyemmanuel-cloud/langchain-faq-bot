[project]
name = "langchain-faq-bot"
version = "0.1.0"
description = "Customer support FAQ assistant using LangChain prompt chains and Groq"
readme = "README.md"
authors = [
    { name = "Anthony Emmanuel", email = "aeemmanuel500@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.5.0",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-faq-bot = "langchain_faq_bot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
